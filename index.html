    <!DOCTYPE html>
    <html lang="ja">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>CSSテスト</title>

        <style>
            h1{
                color: #0000FF;
            } 

            h2{
                color:rgb(0,255,0)
            }

            h3{
                color:rgb(100%,0%,0%)
            }

            h4{
                color:pink
            }


            h5{
                color:rgb(190,220,17)
            }
        </style>
    </head>
    <body>

        <h1>16新数RGBで色指定</h1>

        <h2>16新数RGBで色指定</h2>

        <h3>％RGBで色指定</h3>

        <h4>カラー名で色指定</h4>

        <h5>カラーピッカーで色指定</h5>

        
    </body>
    </html>
